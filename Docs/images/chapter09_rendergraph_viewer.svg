<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Yu Gothic, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Render Graph Viewer の見方（輪郭線：Outline08）</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#555">R = 読む（Read）　W = 書く（Write）　緑の線 = リソースが生きている期間</text>

  <!-- 列ヘッダー（パス） -->
  <rect x="250" y="70" width="170" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="335" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Outline08</text>
  <rect x="470" y="70" width="170" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="555" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Outline08 Copy</text>

  <!-- 行ラベル（リソース） -->
  <text x="40" y="158" font-size="15" font-weight="bold" fill="#222">Camera Color</text>
  <text x="40" y="238" font-size="15" font-weight="bold" fill="#222">Depth</text>
  <text x="40" y="318" font-size="15" font-weight="bold" fill="#222">_OutlineTemp</text>

  <!-- 区切り線 -->
  <line x1="40" y1="122" x2="920" y2="122" stroke="#ddd"/>
  <line x1="40" y1="202" x2="920" y2="202" stroke="#ddd"/>
  <line x1="40" y1="282" x2="920" y2="282" stroke="#ddd"/>

  <!-- Camera Color：Outline08 で R、Copy で W -->
  <rect x="250" y="130" width="170" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="335" y="158" text-anchor="middle" font-size="14" fill="#0d47a1">R　読む</text>
  <rect x="470" y="130" width="170" height="44" rx="6" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="555" y="158" text-anchor="middle" font-size="14" fill="#bf360c">W　書く（戻す）</text>
  <rect x="250" y="184" width="390" height="6" rx="3" fill="#43a047"/>

  <!-- Depth：Outline08 で R のみ -->
  <rect x="250" y="210" width="170" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="335" y="238" text-anchor="middle" font-size="14" fill="#0d47a1">R　読む</text>
  <rect x="250" y="264" width="170" height="6" rx="3" fill="#43a047"/>

  <!-- _OutlineTemp：Outline08 で W、Copy で R -->
  <rect x="250" y="290" width="170" height="44" rx="6" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="335" y="318" text-anchor="middle" font-size="14" fill="#bf360c">W　書く</text>
  <rect x="470" y="290" width="170" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="555" y="318" text-anchor="middle" font-size="14" fill="#0d47a1">R　読む</text>
  <rect x="250" y="344" width="390" height="6" rx="3" fill="#43a047"/>

  <!-- 注釈 -->
  <text x="40" y="386" font-size="13" fill="#333">・_OutlineTemp は Outline08 で書かれ、Outline08 Copy で読まれた後、寿命が終わる（同じメモリは再利用可能）</text>
  <text x="40" y="408" font-size="13" fill="#333">・Camera Color は全体にわたって使われるため、寿命が最も長い　・Depth は Outline08 でのみ読まれる</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
