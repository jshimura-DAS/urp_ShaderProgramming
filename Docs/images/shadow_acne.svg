<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Noto Sans JP','Meiryo','Hiragino Sans',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a300"/>
    </marker>
    <pattern id="acne" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#d9c48f"/>
      <rect width="14" height="7" fill="#5a4a2c"/>
    </pattern>
    <pattern id="acneSphere" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="#cfd8dc"/>
      <rect width="10" height="5" fill="#37474f"/>
    </pattern>
    <radialGradient id="sph" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#90a4ae"/>
    </radialGradient>
    <clipPath id="clipL"><rect x="540" y="90" width="200" height="200"/></clipPath>
    <clipPath id="clipR"><rect x="770" y="90" width="200" height="200"/></clipPath>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- ===== Panel A ===== -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">① 原因:シャドウマップの深度は「テクセル単位の離散値」</text>
  <text x="20" y="52" font-size="12" fill="#555">(断面図:光は左上から右下へ。地面は平らなのに、保存深度は傾いた段差になる)</text>

  <!-- sun -->
  <circle cx="45" cy="95" r="16" fill="#f5b700"/>
  <text x="45" y="125" font-size="12" text-anchor="middle" fill="#555">ライト</text>

  <!-- ground -->
  <rect x="40" y="330" width="460" height="40" fill="#8a7a55"/>
  <text x="270" y="357" font-size="13" text-anchor="middle" fill="#fff">平らな地面(Plane)</text>

  <!-- lit / false-shadow bars (centers 90,180,270,360,450) -->
  <g>
    <rect x="45"  y="322" width="45" height="8" fill="#ffd54f"/><rect x="90"  y="322" width="45" height="8" fill="#e53935"/>
    <rect x="135" y="322" width="45" height="8" fill="#ffd54f"/><rect x="180" y="322" width="45" height="8" fill="#e53935"/>
    <rect x="225" y="322" width="45" height="8" fill="#ffd54f"/><rect x="270" y="322" width="45" height="8" fill="#e53935"/>
    <rect x="315" y="322" width="45" height="8" fill="#ffd54f"/><rect x="360" y="322" width="45" height="8" fill="#e53935"/>
    <rect x="405" y="322" width="45" height="8" fill="#ffd54f"/><rect x="450" y="322" width="45" height="8" fill="#e53935"/>
  </g>

  <!-- light rays -->
  <g stroke="#f5a300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)">
    <line x1="30"  y1="240" x2="86"  y2="326"/>
    <line x1="120" y1="240" x2="176" y2="326"/>
    <line x1="210" y1="240" x2="266" y2="326"/>
    <line x1="300" y1="240" x2="356" y2="326"/>
    <line x1="390" y1="240" x2="446" y2="326"/>
  </g>

  <!-- stored depth segments (perpendicular to light) -->
  <g stroke="#1565c0" stroke-width="5" stroke-linecap="round">
    <line x1="58"  y1="362" x2="122" y2="298"/>
    <line x1="148" y1="362" x2="212" y2="298"/>
    <line x1="238" y1="362" x2="302" y2="298"/>
    <line x1="328" y1="362" x2="392" y2="298"/>
    <line x1="418" y1="362" x2="482" y2="298"/>
  </g>
  <text x="212" y="288" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">シャドウマップの保存深度</text>
  <text x="212" y="304" font-size="11" fill="#1565c0" text-anchor="middle" dy="-0">(1テクセル=1つの値)</text>

  <!-- annotations -->
  <path d="M112 322 L112 395" stroke="#e53935" stroke-width="1.5"/>
  <path d="M68 322 L68 395" stroke="#f9a825" stroke-width="1.5"/>
  <text x="68" y="412" font-size="12" fill="#b28704" text-anchor="middle" font-weight="bold">地面が保存深度より手前</text>
  <text x="68" y="428" font-size="12" fill="#b28704" text-anchor="middle">→ 正しく照らされる</text>
  <text x="200" y="412" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">地面が保存深度より奥</text>
  <text x="200" y="428" font-size="12" fill="#c62828" text-anchor="middle">→ 自分自身の影と誤判定</text>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <rect x="30" y="455" width="16" height="10" fill="#ffd54f"/><text x="52" y="464">明るい(正常)</text>
    <rect x="150" y="455" width="16" height="10" fill="#e53935"/><text x="172" y="464">誤って影になる部分(アクネ)</text>
    <line x1="340" y1="460" x2="366" y2="460" stroke="#1565c0" stroke-width="5"/><text x="372" y="464">保存深度</text>
    <line x1="440" y1="460" x2="466" y2="460" stroke="#f5a300" stroke-width="1.5" stroke-dasharray="5 4"/><text x="472" y="464">光線</text>
  </g>
  <text x="30" y="492" font-size="12" fill="#555">この「手前/奥」の交互の繰り返しが、画面上では縞模様として見える。</text>

  <line x1="520" y1="20" x2="520" y2="500" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- ===== Panel B ===== -->
  <text x="540" y="30" font-size="18" font-weight="bold" fill="#222">② 結果:地面と球に縞模様が出る</text>
  <text x="540" y="52" font-size="12" fill="#555">(真上から見た画面イメージ)</text>

  <!-- Without bias -->
  <text x="640" y="80" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Bias なし(シャドウアクネ)</text>
  <rect x="540" y="90" width="200" height="200" fill="url(#acne)" stroke="#444"/>
  <ellipse cx="672" cy="196" rx="52" ry="24" fill="#2b2112" opacity="0.85" clip-path="url(#clipL)"/>
  <circle cx="625" cy="170" r="42" fill="url(#acneSphere)" stroke="#263238"/>
  <text x="640" y="310" font-size="12" fill="#c62828" text-anchor="middle">本来明るいはずの面に縞状の影</text>

  <!-- With bias -->
  <text x="870" y="80" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Bias 適用後(正常)</text>
  <rect x="770" y="90" width="200" height="200" fill="#d9c48f" stroke="#444"/>
  <ellipse cx="902" cy="196" rx="52" ry="24" fill="#2b2112" opacity="0.85" clip-path="url(#clipR)"/>
  <circle cx="855" cy="170" r="42" fill="url(#sph)" stroke="#263238"/>
  <text x="870" y="310" font-size="12" fill="#2e7d32" text-anchor="middle">球が落とす本物の影だけが残る</text>

  <!-- notes -->
  <g font-size="13" fill="#333">
    <text x="540" y="360" font-weight="bold">見分け方・ポイント</text>
    <text x="540" y="384">・縞の間隔 ≒ シャドウマップ1テクセルの幅</text>
    <text x="540" y="406">・光が地面に浅い角度で当たる(N·L が小さい)ほど強く出る</text>
    <text x="540" y="428">・影の落ちていない面にも模様が出たらアクネを疑う</text>
    <text x="540" y="450" font-weight="bold" fill="#2e7d32">対策:Depth Bias / Normal Bias を上げる(上げすぎると影が浮く)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
